<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="static/css/form.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create account</title>
</head>

<body>
    <div class="container">
        <div class="logo">CL</div>
        <h1>create account</h1>
        <p class="subtitle">joinus today and get started</p>
        <form action="" method="post">
            <div class="input-group">
                <label for="full name">full name</label>
                <input type="full name" id="full name" name="full name" placeholder="enter your name">

            </div>

            <div class="input-group">
                <label for="email">email adress</label>
                <input type="email" id="email" name="email" placeholder="enter email adress">
            </div>
            <div class="input-group">
                <label for="pass">password</label>
                <input type="password" id="pass" name="pass" placeholder="enter password">
            </div>
            <div class="input-group">
                <label for="conf pass">confirm password</label>
                <input type="password" id="confpass" name="confpass" placeholder="confirm password">
            </div>
            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">i agree to the terms and conditions</label>
            </div>
            <button type="submit"> create account</button>

        </form>
        <p class="login"> Already have an account?<a href="">login</a></p>
    </div>

</body>

</html>
