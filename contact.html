<body>
    <h1>Contact Us</h1>
    <p>If you have any questions or need assistance, feel free to reach out to us:</p>


    <h2>get in touch</h2>
    <table class="contact-info">
        <tr>
            <th>email</th>
            <td><a href="mailto:info@visikenya.com">info@visitkenya.com</a></td>
        </tr>
        <tr>
            <th>phone</th>
            <td>0790022944</td>
        </tr>
        <tr>
            <th>location</th>
            <td>Nairobi, Kenya</td>
        </tr>

    </table>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email"><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" required
            placeholder="Enter your message"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>
